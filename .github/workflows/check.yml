name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: |
          bun run build
          test -x "desktop/build.noindex/LiteLLM Spend.app/Contents/MacOS/OpenCodeSpend"
      - run: bun run smoke
